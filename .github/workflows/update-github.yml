name: Sync GitHub activity

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/profile.json", "scripts/update-github.mjs"]

permissions:
  contents: write

concurrency:
  group: github-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch GitHub data
        env:
          # Add a fine-grained PAT (read-only, public repos) as GH_PAT to get the contribution heatmap.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/update-github.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet data/github.json; then echo "Nothing to commit"; exit 0; fi
          git config user.name "portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          git commit -m "chore: sync GitHub activity"
          git push
