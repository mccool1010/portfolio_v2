<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flowchart - Count Even and Odd Numbers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .page {
            width: 794px;
            min-height: 1123px;
            background: #fff;
            padding: 40px 30px;
        }
        h1 {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #555;
            margin-bottom: 25px;
        }
        svg { display: block; margin: 0 auto; }
        @media print {
            body { padding: 0; }
            .page { width: 100%; padding: 30px 20px; min-height: auto; }
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Flowchart: Count Even and Odd Numbers in a List</h1>
        <p class="subtitle">Take a list of integers, count how many are even and how many are odd, then display the counts</p>

        <svg width="700" height="1050" viewBox="0 0 700 1050" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
                </marker>
            </defs>

            <!-- START -->
            <ellipse cx="350" cy="35" rx="80" ry="28" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
            <text x="350" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#1b5e20">Start</text>

            <!-- Arrow: Start -> Input -->
            <line x1="350" y1="63" x2="350" y2="93" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- INPUT: List of numbers -->
            <polygon points="250,125 350,95 450,125 350,155" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text x="350" y="123" text-anchor="middle" font-size="12" font-weight="500" fill="#0d47a1">Input: List of</text>
            <text x="350" y="138" text-anchor="middle" font-size="12" font-weight="500" fill="#0d47a1">Numbers</text>

            <!-- Arrow: Input -> Initialize -->
            <line x1="350" y1="155" x2="350" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- PROCESS: Initialize counters -->
            <rect x="230" y="190" width="240" height="50" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
            <text x="350" y="212" text-anchor="middle" font-size="12" font-weight="500" fill="#e65100">Set EvenCount = 0</text>
            <text x="350" y="228" text-anchor="middle" font-size="12" font-weight="500" fill="#e65100">Set OddCount = 0</text>

            <!-- Arrow: Initialize -> Set i -->
            <line x1="350" y1="240" x2="350" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- PROCESS: Set i = 0 -->
            <rect x="260" y="275" width="180" height="40" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
            <text x="350" y="300" text-anchor="middle" font-size="12" font-weight="500" fill="#e65100">Set i = 0</text>

            <!-- Arrow: Set i -> Loop check -->
            <line x1="350" y1="315" x2="350" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- DECISION: i < length of list? -->
            <polygon points="350,355 500,410 350,465 200,410" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
            <text x="350" y="405" text-anchor="middle" font-size="12" font-weight="500" fill="#bf360c">Is i &lt; Length</text>
            <text x="350" y="422" text-anchor="middle" font-size="12" font-weight="500" fill="#bf360c">of List?</text>

            <!-- No branch (right) -> Display results -->
            <line x1="500" y1="410" x2="600" y2="410" stroke="#333" stroke-width="1.5"/>
            <line x1="600" y1="410" x2="600" y2="870" stroke="#333" stroke-width="1.5"/>
            <line x1="600" y1="870" x2="460" y2="870" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <text x="545" y="402" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">No</text>

            <!-- Yes branch (down) -->
            <line x1="350" y1="465" x2="350" y2="500" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <text x="365" y="487" font-size="12" font-weight="600" fill="#2e7d32">Yes</text>

            <!-- PROCESS: Get current number -->
            <rect x="240" y="505" width="220" height="40" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
            <text x="350" y="530" text-anchor="middle" font-size="12" font-weight="500" fill="#e65100">Read Number = List[i]</text>

            <!-- Arrow: Get number -> Check even/odd -->
            <line x1="350" y1="545" x2="350" y2="580" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- DECISION: Is Number % 2 == 0? -->
            <polygon points="350,585 490,640 350,695 210,640" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
            <text x="350" y="635" text-anchor="middle" font-size="12" font-weight="500" fill="#bf360c">Is Number</text>
            <text x="350" y="652" text-anchor="middle" font-size="12" font-weight="500" fill="#bf360c">% 2 == 0?</text>

            <!-- Yes branch (left) -> Increment EvenCount -->
            <line x1="210" y1="640" x2="120" y2="640" stroke="#333" stroke-width="1.5"/>
            <line x1="120" y1="640" x2="120" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <text x="165" y="632" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7d32">Yes</text>

            <!-- PROCESS: EvenCount = EvenCount + 1 -->
            <rect x="30" y="725" width="180" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
            <text x="120" y="750" text-anchor="middle" font-size="12" font-weight="500" fill="#1b5e20">EvenCount = EvenCount + 1</text>

            <!-- No branch (right) -> Increment OddCount -->
            <line x1="490" y1="640" x2="560" y2="640" stroke="#333" stroke-width="1.5"/>
            <line x1="560" y1="640" x2="560" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            <text x="525" y="632" text-anchor="middle" font-size="12" font-weight="600" fill="#c62828">No</text>

            <!-- PROCESS: OddCount = OddCount + 1 -->
            <rect x="470" y="725" width="180" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text x="560" y="750" text-anchor="middle" font-size="12" font-weight="500" fill="#0d47a1">OddCount = OddCount + 1</text>

            <!-- Both branches merge -> i = i + 1 -->
            <line x1="120" y1="765" x2="120" y2="795" stroke="#333" stroke-width="1.5"/>
            <line x1="120" y1="795" x2="350" y2="795" stroke="#333" stroke-width="1.5"/>

            <line x1="560" y1="765" x2="560" y2="795" stroke="#333" stroke-width="1.5"/>
            <line x1="560" y1="795" x2="350" y2="795" stroke="#333" stroke-width="1.5"/>

            <line x1="350" y1="795" x2="350" y2="810" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- PROCESS: i = i + 1 -->
            <rect x="270" y="815" width="160" height="40" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
            <text x="350" y="840" text-anchor="middle" font-size="12" font-weight="500" fill="#e65100">i = i + 1</text>

            <!-- Arrow: i = i+1 -> Loop back to decision -->
            <line x1="270" y1="835" x2="150" y2="835" stroke="#333" stroke-width="1.5"/>
            <line x1="150" y1="835" x2="150" y2="410" stroke="#333" stroke-width="1.5"/>
            <line x1="150" y1="410" x2="200" y2="410" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- DISPLAY: EvenCount and OddCount -->
            <polygon points="260,900 350,870 440,900 350,930" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text x="350" y="898" text-anchor="middle" font-size="11" font-weight="500" fill="#0d47a1">Display EvenCount</text>
            <text x="350" y="913" text-anchor="middle" font-size="11" font-weight="500" fill="#0d47a1">and OddCount</text>

            <!-- Arrow: Display -> Stop -->
            <line x1="350" y1="930" x2="350" y2="965" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

            <!-- STOP -->
            <ellipse cx="350" cy="995" rx="80" ry="28" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
            <text x="350" y="1000" text-anchor="middle" font-size="14" font-weight="600" fill="#b71c1c">Stop</text>
        </svg>
    </div>
</body>
</html>
